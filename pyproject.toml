[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D100", "D101", "D102", "D103", "D107"]

[tool.ruff.lint.per-file-ignores]
"skills/**/*.py" = ["D100", "D101", "D102", "D103", "D107"]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_ai: explicit manual tests that may construct live AI provider clients; skipped unless --run-live-ai is supplied.",
]
