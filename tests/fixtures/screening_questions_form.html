<!doctype html>
<html>
  <body>
    <h1>Automation Engineer</h1>
    <p>Example Co screens each applicant before review.</p>
    <form>
      <label for="work_permit">Are you authorized to work in Germany?</label>
      <select id="work_permit" name="work_permit" required>
        <option>Yes</option>
        <option>No</option>
      </select>
      <label for="notice">What is your notice period?</label>
      <input id="notice" name="notice" required>
      <label for="salary">Salary expectation</label>
      <input id="salary" name="salary_expectation">
    </form>
  </body>
</html>
