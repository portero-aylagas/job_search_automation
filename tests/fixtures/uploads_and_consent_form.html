<!doctype html>
<html>
  <body>
    <h1>Automation Engineer</h1>
    <p>Example Co requires a CV and asks applicants to upload a cover letter.</p>
    <p>Please upload a cover letter. Apply by 2026-06-30. Contact recruiting@example.com.</p>
    <form>
      <label for="resume">Resume or CV</label>
      <input id="resume" name="resume" type="file" accept=".pdf" required>
      <label for="cover">Cover letter</label>
      <input id="cover" name="cover_letter" type="file" accept=".pdf">
      <label for="privacy">I consent to privacy and data processing terms.</label>
      <input id="privacy" name="privacy_consent" type="checkbox" required>
    </form>
  </body>
</html>
